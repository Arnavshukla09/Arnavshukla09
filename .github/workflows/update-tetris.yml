name: Generate Tetris Contribution GIF

on:
  schedule:
    - cron: "0 0 * * *" # Runs every day at midnight UTC
  workflow_dispatch: # Allows manual triggering
  push:
    branches:
      - main
    paths:
      - '.github/scripts/**'
      - '.github/workflows/update-tetris.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r .github/scripts/requirements.txt

      - name: Generate Tetris GIF
        run: |
          # Fetch for the current year
          python .github/scripts/main.py -u Arnavshukla09 -y $(date +%Y)

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update tetris contribution gif"
          file_pattern: assets/tetris.gif
          branch: main
