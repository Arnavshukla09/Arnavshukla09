<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&amp;family=Fira+Code:wght@400;500&amp;display=swap');
      
      .title { font-family: 'Outfit', sans-serif; font-size: 24px; font-weight: 800; fill: #e2e8f0; }
      .text { font-family: 'Outfit', sans-serif; font-size: 16px; font-weight: 400; fill: #94a3b8; }
      .highlight { fill: #38bdf8; font-weight: 600; }
      
      @keyframes pulse {
        0% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.1); opacity: 1; }
        100% { transform: scale(1); opacity: 0.8; }
      }
      .dot { animation: pulse 2s infinite; transform-origin: center; fill: #10b981; }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="#0d1117" rx="12" />
  
  <text x="40" y="50" class="title">⚡ Current Focus</text>
  
  <g transform="translate(40, 80)">
    <circle cx="10" cy="5" r="5" class="dot" style="animation-delay: 0s" />
    <text x="30" y="10" class="text">Building autonomous AI agents using <tspan class="highlight">Model Context Protocol (MCP)</tspan></text>
  </g>
  
  <g transform="translate(40, 120)">
    <circle cx="10" cy="5" r="5" class="dot" style="animation-delay: 0.5s" />
    <text x="30" y="10" class="text">Scaling distributed systems with <tspan class="highlight">Go</tspan> and <tspan class="highlight">Kubernetes</tspan></text>
  </g>
  
  <g transform="translate(40, 160)">
    <circle cx="10" cy="5" r="5" class="dot" style="animation-delay: 1s" />
    <text x="30" y="10" class="text">Optimizing local LLM inference pipelines with <tspan class="highlight">Ollama</tspan> and <tspan class="highlight">Qwen</tspan></text>
  </g>
</svg>
