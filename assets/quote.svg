<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 140" width="800" height="140">
  <defs>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;500&amp;display=swap');
      .quote { font-family: 'Outfit', sans-serif; font-size: 28px; font-weight: 300; fill: #e5e7eb; }
      .author { font-family: 'Outfit', sans-serif; font-size: 20px; font-weight: 500; fill: #9ca3af; }
    </style>
  </defs>
  
  <rect x="2" y="2" width="796" height="136" rx="15" fill="#161b22" stroke="url(#borderGrad)" stroke-width="2" />
  
  <text x="50%" y="50%" text-anchor="middle" class="quote">"Don't be a know-it-all, be a learn-it-all."</text>
  <text x="50%" y="80%" text-anchor="middle" class="author">— Satya Nadella</text>
