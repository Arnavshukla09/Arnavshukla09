<svg xmlns="http://www.w3.org/2000/svg" width="800" height="250" viewBox="0 0 800 250">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&amp;display=swap');
      
      .card { fill: #161b22; stroke: #30363d; stroke-width: 1; rx: 8; }
      .title { font-family: 'Outfit', sans-serif; font-size: 20px; font-weight: 800; fill: #e2e8f0; }
      .desc { font-family: 'Outfit', sans-serif; font-size: 14px; font-weight: 400; fill: #94a3b8; }
      .icon-bg { fill: #21262d; rx: 6; }
      .icon { font-family: 'Outfit', sans-serif; font-size: 20px; }
      
      @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-5px); }
        100% { transform: translateY(0px); }
      }
      .g-card { animation: float 4s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="#0d1117" rx="12" />

  <!-- Card 1 -->
  <g transform="translate(40, 40)" class="g-card" style="animation-delay: 0s">
    <rect width="220" height="170" class="card" />
    <rect x="20" y="20" width="40" height="40" class="icon-bg" />
    <text x="32" y="47" class="icon">🚀</text>
    <text x="20" y="90" class="title">Performance</text>
    <text x="20" y="115" class="desc">Optimizing algorithms,</text>
    <text x="20" y="135" class="desc">reducing compute overhead,</text>
    <text x="20" y="155" class="desc">and tracking strict SLAs.</text>
  </g>

  <!-- Card 2 -->
  <g transform="translate(290, 40)" class="g-card" style="animation-delay: 1s">
    <rect width="220" height="170" class="card" />
    <rect x="20" y="20" width="40" height="40" class="icon-bg" />
    <text x="32" y="47" class="icon">🧠</text>
    <text x="20" y="90" class="title">Applied AI</text>
    <text x="20" y="115" class="desc">Integrating LLMs with</text>
    <text x="20" y="135" class="desc">physical physics engines</text>
    <text x="20" y="155" class="desc">and real-world APIs.</text>
  </g>

  <!-- Card 3 -->
  <g transform="translate(540, 40)" class="g-card" style="animation-delay: 2s">
    <rect width="220" height="170" class="card" />
    <rect x="20" y="20" width="40" height="40" class="icon-bg" />
    <text x="32" y="47" class="icon">🔒</text>
    <text x="20" y="90" class="title">Security</text>
    <text x="20" y="115" class="desc">Implementing Row-Level</text>
    <text x="20" y="135" class="desc">Security and multi-tenant</text>
    <text x="20" y="155" class="desc">isolation by default.</text>
  </g>
</svg>
